name: CD - Deploy to Azure

on:
  push:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - ".github/workflows/**"

env:
  AZURE_WEBAPP_NAME: github-actions-web-app
  AZURE_RESOURCE_GROUP: github-actions-rg
  STORAGE_ACCOUNT: githubactionsa
  CONTAINER_NAME: githubactions-deployments
  DOTNET_VERSION: '9.0.x'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create deployment package
        run: |
          zip -r app.zip ./publish
          echo "PACKAGE_NAME=myapi-${GITHUB_SHA}.zip" >> $GITHUB_ENV
          mv app.zip $PACKAGE_NAME

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload package to Blob storage
        run: |
          az storage blob upload \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --container-name ${{ env.CONTAINER_NAME }} \
            --file $PACKAGE_NAME \
            --name $PACKAGE_NAME \
            --auth-mode login \
            --overwrite true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_NAME }}

      - name: Smoke test
        run: |
          # правь endpoint под свой
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Checking $URL"
          curl -f "$URL"